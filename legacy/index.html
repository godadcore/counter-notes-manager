<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Counter Notes Bot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  :root {
    --bg: #0F0F0F;
    --surface: #181818;
    --surface-2: #222222;
    --surface-3: #2A2A2A;
    --border: #303030;
    --text: #FFFFFF;
    --muted: #A3A3A3;
    --red: #FF0000;
    --red-dark: #CC0000;
    --green: #2BA640;
    --yellow: #F5B400;
    --slate: #334155;
    --sans: "Plus Jakarta Sans", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    line-height: 1.55;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  button, select, input { font-family: inherit; }
  button { cursor: pointer; }
  a { color: #ff4d4d; text-decoration: none; }
  a:hover { text-decoration: underline; }
  :focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }
  svg.lucide { width: 16px; height: 16px; stroke-width: 2; flex-shrink: 0; }

  .top-header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 22px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .brand-wrap { display: flex; align-items: center; }
  .brand-logo {
    height: 64px;
    width: auto;
    display: block;
  }
  .header-meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .pill {
    background: var(--surface-2);
    border: 1px solid var(--border);
    padding: 6px 10px;
    border-radius: 999px;
    font-size: 12px;
    color: var(--muted);
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .pill strong, .pill.hot { color: var(--text); }
  .char-banner {
    background: #1a0d0d;
    border-bottom: 1px solid var(--red);
    color: #fff;
    padding: 10px 22px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13.5px;
    font-weight: 600;
  }
  .char-banner svg { color: #ff6666; }

  .app-shell {
    display: flex;
    flex: 1;
    min-height: 0;
    width: 100%;
  }
  .sidebar {
    width: 30%;
    flex: 0 0 30%;
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 18px 14px 28px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    overflow-y: auto;
    scroll-behavior: smooth;
  }
  .sidebar-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.3px;
    color: var(--muted);
    padding: 4px 10px 8px;
    font-weight: 700;
  }
  .nav-tab {
    width: 100%;
    text-align: left;
    background: var(--surface-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-left: 4px solid transparent;
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 650;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .nav-tab:hover { background: var(--surface-3); }
  .nav-tab.active {
    background: #261212;
    border-color: var(--red);
    border-left-color: var(--red);
  }
  .nav-tab span { display: block; }
  .nav-kicker {
    display: block;
    font-size: 11px;
    font-weight: 500;
    color: var(--muted);
    margin-top: 2px;
  }
  .nav-tab.active .nav-kicker { color: #ff8a8a; }
  .side-note {
    margin-top: auto;
    padding: 12px 10px 0;
    font-size: 12px;
    color: var(--muted);
  }

  .main-content {
    width: 70%;
    flex: 1 1 70%;
    min-width: 0;
    padding: 24px 28px 72px;
    overflow-y: auto;
    scroll-behavior: smooth;
  }
  .section-title {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.4px;
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .section-sub { color: var(--muted); font-size: 14px; margin-bottom: 18px; max-width: 760px; }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 20px;
    margin-bottom: 16px;
  }
  .card h3 {
    font-size: 16px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .card h4 { font-size: 14px; color: #ff6666; margin: 14px 0 6px; }
  .lede { font-size: 15px; margin-bottom: 8px; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .stat-box {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
  }
  .stat-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    color: var(--muted);
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .stat-val { font-size: 15px; font-weight: 700; }
  .clean-list { padding-left: 18px; }
  .clean-list li { margin: 7px 0; font-size: 14px; }
  .asset-grid {
    display: grid;
    grid-template-columns: 0.7fr 1.3fr;
    gap: 14px;
    align-items: center;
    margin-bottom: 14px;
  }
  .asset-shot {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: #0F0F0F;
  }
  .character-shot {
    max-width: 280px;
    background: #d9dde3;
  }
  .quote {
    border-left: 3px solid var(--red);
    padding: 8px 12px;
    color: #f3f3f3;
    font-size: 15px;
    margin-top: 8px;
  }

  .subnav {
    position: sticky;
    top: 0;
    z-index: 4;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    background: rgba(15, 15, 15, 0.94);
    padding: 8px 0 12px;
    margin-bottom: 8px;
  }
  .subnav button {
    background: var(--surface-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 7px 12px;
    font-size: 12px;
    font-weight: 650;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .subnav button:hover { border-color: var(--red); }
  .anchor { scroll-margin-top: 58px; }

  .filter-row, .count-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .filter-chip, .count-pill {
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--muted);
    border-radius: 999px;
    padding: 6px 10px;
    font-size: 12px;
    font-weight: 650;
  }
  .filter-chip.active { color: #fff; border-color: var(--red); background: #261212; }
  [hidden] { display: none !important; }
  .idea-row {
    display: grid;
    grid-template-columns: 52px 1fr 170px;
    gap: 10px;
    align-items: center;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 8px;
  }
  .idea-row[data-status="scripted"] { border-color: #6d5810; }
  .idea-row[data-status="ready"] { border-color: var(--red); }
  .idea-row[data-status="posted"] { border-color: #1f6b38; }
  .idea-num {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
  }
  .idea-title { font-weight: 700; font-size: 14px; }
  .idea-meta { color: var(--muted); font-size: 12px; margin-top: 2px; display: flex; gap: 8px; align-items: center; }
  select.field, .idea-row select {
    width: 100%;
    background: #141414;
    color: #fff;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-weight: 650;
    color-scheme: dark;
  }
  select.video-select { margin-bottom: 14px; }

  .copy-box {
    background: #121212;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    font-family: var(--mono);
    font-size: 12.5px;
    color: #f1f1f1;
    white-space: pre-wrap;
    word-break: break-word;
    line-height: 1.55;
    margin-top: 8px;
    max-height: 320px;
    overflow: auto;
  }
  .copy-box.tall { max-height: 460px; }
  .copy-btn {
    margin-top: 8px;
    background: var(--surface-3);
    color: #fff;
    border: 1px solid #444;
    padding: 8px 14px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 650;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .copy-btn:hover { background: var(--red); border-color: var(--red); }
  .copy-btn.copied { background: var(--green); border-color: var(--green); }
  .copy-btn.solid { background: var(--red); border-color: var(--red); }
  .stack-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .stack-note, .stack-input {
    width: 100%;
    background: #141414;
    color: #fff;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px;
    font-family: var(--mono);
    font-size: 13px;
  }
  .stack-note { min-height: 140px; resize: vertical; line-height: 1.5; }
  .stack-input { font-weight: 650; }
  .stack-state { margin-top: 10px; color: var(--muted); font-size: 13px; }
  .queue-row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    align-items: center;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    margin-bottom: 8px;
  }
  .queue-row strong { display: block; font-size: 14px; }
  .queue-meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .queue-meta.used { color: var(--green); }
  .thumb-card {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    margin-bottom: 12px;
  }
  .task-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 12px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 8px;
    cursor: pointer;
    font-size: 14px;
  }
  .task-item input { margin-top: 3px; accent-color: var(--red); width: 16px; height: 16px; }
  .task-item.done .task-copy { text-decoration: line-through; color: var(--muted); }
  .task-copy { display: block; }
  .task-copy small { display: block; color: var(--muted); font-size: 12.5px; text-decoration: none; margin-top: 2px; }
  .task-item.done .task-copy small { text-decoration: none; }
  .week-head {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    align-items: baseline;
    margin-bottom: 10px;
  }
  .week-target { color: var(--muted); font-size: 12px; font-weight: 650; }
  .progress {
    height: 8px;
    background: #121212;
    border: 1px solid var(--border);
    border-radius: 999px;
    overflow: hidden;
    margin: 8px 0 14px;
  }
  .progress > span { display: block; height: 100%; background: var(--red); width: 0; }
  .next-card {
    background: linear-gradient(135deg, #241010, #181818);
    border: 1px solid var(--red);
    border-radius: 12px;
    padding: 16px 18px;
    margin-bottom: 16px;
  }
  .next-card h3 { margin-bottom: 6px; }
  .linkish {
    background: none;
    border: none;
    color: #ff6666;
    font-weight: 700;
    padding: 0;
    font-size: 13px;
  }
  .linkish:hover { text-decoration: underline; }
  .day-actions { margin-top: 6px; }
  code.inline {
    font-family: var(--mono);
    font-size: 12px;
    background: #121212;
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 5px;
  }

  @media (max-width: 900px) {
    body { overflow: auto; }
    .app-shell { flex-direction: column; overflow: visible; }
    .sidebar, .main-content { width: 100%; flex: none; }
    .sidebar { border-right: none; border-bottom: 1px solid var(--border); max-height: none; }
    .main-content { overflow: visible; }
    .grid-2, .grid-3, .idea-row, .asset-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header class="top-header">
  <div class="brand-wrap">
    <img src="Logo.png" alt="Counter Notes" class="brand-logo">
  </div>
  <div class="header-meta">
    <span class="pill"><i data-lucide="mic"></i> Colton, US male</span>
    <span class="pill"><i data-lucide="calendar-days"></i> 3 to 5 videos a week</span>
    <span class="pill hot" id="nextPill"><i data-lucide="arrow-right"></i> Next post</span>
  </div>
</header>
<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-label">Counter Notes bot</div>
    <button type="button" class="nav-tab active" data-view="hub" onclick="showView('hub')">
      <i data-lucide="user-round"></i>
      <span>Character<span class="nav-kicker">Logo, host, thumbnails</span></span>
    </button>
    <button type="button" class="nav-tab" data-view="stack" onclick="showView('stack')">
      <i data-lucide="layers"></i>
      <span>Today's Prompt Stack<span class="nav-kicker">Daily prompts and source check</span></span>
    </button>
    <button type="button" class="nav-tab" data-view="studio" onclick="showView('studio')">
      <i data-lucide="pen-line"></i>
      <span>Prompt & Humanizer Studio<span class="nav-kicker">Ideas, scripts, thumbnails, audit</span></span>
    </button>
    <button type="button" class="nav-tab" data-view="plan" onclick="showView('plan')">
      <i data-lucide="calendar-range"></i>
      <span>30-Day Launch Plan<span class="nav-kicker">What to post next</span></span>
    </button>
    <button type="button" class="nav-tab" data-view="vault" onclick="showView('vault')">
      <i data-lucide="folder-key"></i>
      <span>Prompt & Code Vault<span class="nav-kicker">Copy prompts, SEO, snippets</span></span>
    </button>
    <p class="side-note">Runs in this browser. No account and no API key.</p>
  </aside>
  <main class="main-content" id="mainArea"></main>
</div>
<script src="blueprint.js?v=4"></script>
</body>
</html>
