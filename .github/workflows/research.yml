name: Daily research

on:
  schedule:
    - cron: "15 8 * * *"
  workflow_dispatch:

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - name: Wake the host
        env:
          SITE: ${{ secrets.COUNTER_NOTES_URL }}
          PASS: ${{ secrets.COUNTER_NOTES_PASSCODE }}
        run: |
          set -u
          if [ -z "${SITE}" ] || [ -z "${PASS}" ]; then
            echo "Wake: fail"
            exit 1
          fi
          woke=0
          for attempt in 1 2 3; do
            if curl --fail --silent --max-time 70 --output /dev/null "${SITE}/"; then
              woke=1
              break
            fi
            if [ "${attempt}" != "3" ]; then
              sleep 30
            fi
          done
          if [ "${woke}" != "1" ]; then
            echo "Wake: fail"
            exit 1
          fi
          echo "Wake: pass"
          python3 - <<'PY'
          import json, os, sys, time, urllib.request
          site = os.environ["SITE"].rstrip("/")
          password = os.environ["PASS"]

          def call(path, method="GET", payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              request = urllib.request.Request(site + path, data=data, method=method, headers={
                  "content-type": "application/json",
                  "x-counter-notes-passcode": password,
              })
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.loads(response.read().decode())

          try:
              started = call("/api/research/run", "POST", {})
          except Exception:
              print("Research: fail")
              sys.exit(1)
          if not (started.get("started") or started.get("running")):
              print("Research: fail")
              sys.exit(1)
          for _ in range(60):
              try:
                  status = call("/api/research/status")
              except Exception:
                  print("Research: fail")
                  sys.exit(1)
              if status.get("running"):
                  time.sleep(15)
                  continue
              if status.get("error"):
                  print("Research: fail")
                  sys.exit(1)
              if status.get("done"):
                  print("Topics: " + str(status.get("topics") or 0))
                  print("Research: pass")
                  sys.exit(0)
              print("Research: fail")
              sys.exit(1)
          print("Research: fail")
          sys.exit(1)
          PY
      - name: Save an encrypted backup
        env:
          SITE: ${{ secrets.COUNTER_NOTES_URL }}
          PASS: ${{ secrets.COUNTER_NOTES_PASSCODE }}
          BACKUP_KEY: ${{ secrets.BACKUP_KEY }}
        run: |
          set -u
          if [ -z "${BACKUP_KEY}" ]; then
            echo "Backup: fail"
            exit 1
          fi
          if ! curl --fail --silent --max-time 120 \
            -H "x-counter-notes-passcode: ${PASS}" \
            -o counter-notes.sqlite \
            "${SITE}/api/backup"; then
            echo "Backup: fail"
            exit 1
          fi
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -in counter-notes.sqlite \
            -out counter-notes.sqlite.enc \
            -pass env:BACKUP_KEY
          rm -f counter-notes.sqlite
          bytes=$(wc -c < counter-notes.sqlite.enc | tr -d ' ')
          echo "Backup: pass"
          echo "Bytes: ${bytes}"
      - uses: actions/upload-artifact@v4
        with:
          name: counter-notes-backup
          path: counter-notes.sqlite.enc
          retention-days: 7
